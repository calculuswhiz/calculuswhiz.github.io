<!DOCTYPE html>
<html>

<head>
	<meta charset="utf-8">
	<title>Trees!</title>
	<style type="text/css">
		#main-canvas {
			height: 90vh;
		}
	</style>
	<script src="https://code.createjs.com/1.0.0/createjs.min.js"></script>
	<script src="tree.js"></script>
</head>

<body>
	<canvas id="main-canvas" width="1024" height="1024"></canvas>
