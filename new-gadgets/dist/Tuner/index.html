<!DOCTYPE html>
<html>

<head>
	<title>Web Tuner</title>
	<meta charset="utf-8">
<link rel="stylesheet" crossorigin href="../chunk-w7k7m01s.css"><script type="module" crossorigin src="../chunk-1xdvt6c9.js"></script></head>

<body class="font-mono p-2 flex flex-col">
	<table class="border border-black">
		<colgroup>
			<col class="w-120" />
			<col class="bg-gray-200" />
		</colgroup>
		<tbody>
			<tr>
				<td class="text-center border border-dotted border-gray">
					Note
				</td>
				<td class="text-center border border-dotted border-gray">
					<span id="Note">???</span>
				</td>
			</tr>
			<tr>
				<td class="text-center border border-dotted border-gray">
					Cents</td>
				<td class="text-center border border-dotted border-gray">
					<span id="Cents">???</span>
				</td>
			</tr>
			<tr>
				<td class="text-center border border-dotted border-gray">
					Pitch (Hz)
				</td>
				<td class="text-center border border-dotted border-gray">
					<span id="Pitch"></span>
				</td>
			</tr>
			<tr>
				<td class="text-center border border-dotted border-gray">
					Certainty
				</td>
				<td class="text-center border border-dotted border-gray">
					<span id="Certainty"></span>
				</td>
			</tr>
		</tbody>
	</table>
	<div id='cent-i-meter' class="text-center"></div>
	<button id="Activator" class="border bg-gray-200 fixed top-0 left-0 w-full h-full text-4xl">
		Start listening
	</button>
	<canvas width="600" height="400" class="seismometer grow m-auto md:max-w-1/2" id='seismo1'></canvas>
	<div class="flex m-auto">
		<div class="pr-2">Concert A: <input type="text" class="border" id="ConcertA" value="440"></div>
		<div>Graph offset (half steps from A): <input type="text" class="border" id="GraphOffset" value="1"></div>
	</div>
	
</body>

</html>
